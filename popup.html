<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 380px; margin: 0; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f5f6f8; color: #1f2937; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 16px 10px; }
    header h1 { font-size: 15px; margin: 0; font-weight: 700; color: #111827; letter-spacing: 0.5px; }
    .badge { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #fff; border: 1px solid #e5e7eb; color: #9ca3af; }
    .main { padding: 0 16px 10px; }
    /* 状态横幅：页面第一眼看到的就是它 */
    .banner { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid transparent; }
    .banner .b-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
    .banner .b-sub { font-size: 12px; margin-top: 4px; opacity: 0.85; line-height: 1.5; }
    .banner.ok   { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .banner.err  { background: #fef2f2; border-color: #fecaca; color: #7f1d1d; }
    .banner.run  { background: #fffbeb; border-color: #fde68a; color: #78350f; }
    .banner.idle { background: #f3f4f6; border-color: #e5e7eb; color: #4b5563; }
    /* 账号卡：邮箱为主、积分为辅，两行不挤 */
    .acct { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .acct-top { display: flex; align-items: center; gap: 8px; }
    .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; color: #111827; }
    .acct-sub { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #6b7280; margin-top: 4px; overflow: hidden; }
    .pts { color: #16a34a; font-weight: 700; font-size: 12.5px; }
    .reason { color: #b91c1c; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 1.7; white-space: nowrap; }
    .pill.ok { background: #dcfce7; color: #15803d; }
    .pill.warn { background: #fef3c7; color: #b45309; }
    .pill.err { background: #fee2e2; color: #b91c1c; }
    .pill.muted { background: #f3f4f6; color: #6b7280; }
    .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid #fde68a; border-top-color: #d97706; border-radius: 50%; animation: rot 0.8s linear infinite; flex-shrink: 0; }
    @keyframes rot { to { transform: rotate(360deg); } }
    button { width: 100%; padding: 10px 0; border: 0; border-radius: 10px; background: #16a34a; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
    button:hover { background: #15803d; }
    button:disabled { background: #d1d5db; color: #9ca3af; cursor: wait; }
    details.hint { font-size: 11.5px; color: #6b7280; margin: 10px 0 10px; }
    details.hint summary { cursor: pointer; color: #9ca3af; font-size: 11px; outline: none; }
    details.hint .h-body { line-height: 1.7; margin-top: 6px; }
    details.hint b { color: #374151; }
    a { color: #16a34a; text-decoration: none; font-weight: 600; }
    .history { border-top: 1px solid #e5e7eb; padding: 8px 16px 12px; max-height: 200px; overflow-y: auto; }
    .history h2 { font-size: 11px; color: #9ca3af; margin: 6px 0; font-weight: 600; letter-spacing: 1px; }
    .item { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 2; border-bottom: 1px dashed #f0f0f0; min-width: 0; }
    .item:last-child { border-bottom: 0; }
    .when { color: #9ca3af; font-size: 11px; flex-shrink: 0; }
    .item .who { font-weight: 400; font-size: 12px; }
    .item .st { flex-shrink: 0; display: flex; align-items: center; }
    .muted { color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1>GLaDOS 签到</h1>
    <span class="badge" id="ver"></span>
  </header>
  <div class="main">
    <div id="banner" class="banner idle"></div>
    <div id="accounts"></div>
    <button id="run">立即签到（全部账号）</button>
    <details class="hint">
      <summary>使用说明</summary>
      <div class="h-body">
        每天在 <b>12:15~12:45</b> 与 <b>19:00~19:20</b> 中随机时刻自动运行一轮：用 GLaDOS 官方账号切换接口，给所有已绑定账号各签一次，结束自动切回你的账号。成功日全天只发一轮请求；失败当天自动重试（最多 3 次）；次日 Chrome 启动未签也会补签。<br />
        首次绑定：控制台右上角账号菜单 <b>「添加账号」</b>。<a href="https://glados.rocks/console" target="_blank">打开控制台</a>
      </div>
    </details>
  </div>
  <div class="history">
    <h2>最近记录</h2>
    <div id="list">加载中…</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
